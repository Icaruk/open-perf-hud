version: '3'

tasks:
  default:
    deps: [build]

  modernize:
    desc: Apply Go modernization rewrites (built-in go fix analyzers)
    cmds:
      - go fix ./...

  build:
    desc: Build the overlay GUI (open-perf-hud.exe) and the CLI (oph-cli.exe)
    deps: [modernize]
    env:
      CGO_ENABLED: "0" # pure Go, no cgo: same size, no toolchain surprises
    cmds:
      - go build -trimpath -buildvcs=false -ldflags "-s -w -H windowsgui -buildid=" -o open-perf-hud.exe .
      - go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" -o oph-cli.exe .

  check:
    desc: gofmt (list pending) + go vet + go test (C struct layout on x64)
    cmds:
      - gofmt -l .
      - go vet ./...
      - go test ./...

  run:
    desc: Build and launch the overlay
    deps: [build]
    cmds:
      - pwsh -NoProfile -Command "Start-Process -FilePath .\open-perf-hud.exe -WorkingDirectory ."

  cli:
    desc: Metrics in the console (Ctrl+C to exit)
    deps: [build]
    cmds:
      - cmd: .\oph-cli.exe --cli
        ignore_error: true # Ctrl+C returns a non-zero code

  probe:
    desc: 'ETW event histogram. Usage: task probe -- 10s'
    deps: [build]
    cmds:
      - .\oph-cli.exe --probe {{.CLI_ARGS | default "10s"}}

  alerttest:
    desc: 'Test visual del rojo de alerta (9 colores x 5 fondos). Reporta por nº de fila.'
    cmds:
      - pwsh -NoProfile -File scripts/alert-test.ps1

  smoke:
    desc: Overlay alive for 6s without dying + CLI printing a metrics line for 4s
    cmds:
      - pwsh -NoProfile -File scripts/smoke.ps1

  clean:
    desc: Delete the exes
    cmds:
      - pwsh -NoProfile -Command "Remove-Item open-perf-hud.exe, oph-cli.exe -ErrorAction SilentlyContinue"

  icon:
    desc: Regenerate icon.ico, and rsrc.syso (icon + common-controls v6 manifest; requires go install github.com/tc-hib/go-winres@latest)
    cmds:
      - pwsh -NoProfile -File scripts/gen-icon.ps1
      - "$HOME/go/bin/go-winres.exe make --in winres.json --arch amd64 --out rsrc.syso --no-suffix"
